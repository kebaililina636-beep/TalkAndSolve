<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TalkAndSolve</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #e6f2e6; /* أخضر فاتح */
      color: #064420; /* أخضر داكن للنصوص */
      margin: 0;
      padding: 0;
    }
    .container {
      max-width: 600px;
      margin: 50px auto;
      background: #cce5cc; /* أخضر متوسط */
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    h1 {
      text-align: center;
      margin-bottom: 25px;
    }
    form {
      display: flex;
      flex-direction: column;
    }
    input, textarea {
      width: 100%;
      margin: 10px 0;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #99cc99;
      background-color: #f0fff0;
      font-size: 16px;
      box-sizing: border-box;
    }
    textarea {
      resize: vertical;
      min-height: 80px;
    }
    button {
      padding: 12px;
      margin-top: 15px;
      border: none;
      border-radius: 8px;
      background: #3d9970;
      color: #fff;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.3s;
    }
    button:hover {
      background: #2e7554;
    }
    label {
      display: flex;
      align-items: center;
      margin-top: 10px;
      font-size: 14px;
    }
    label input {
      margin-right: 8px;
    }
    /* لجعل النموذج متمركز على الشاشات الصغيرة */
    @media (max-width: 650px) {
      .container {
        margin: 20px;
        padding: 20px;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <h1>TalkAndSolve</h1>

  <form id="problemForm">
    <input type="text" id="name" placeholder="اسمك" required>
    <input type="text" id="type" placeholder="نوع المشكلة" required>
    <textarea id="description" placeholder="صف المشكلة" required></textarea>
    <label>
      <input type="checkbox" id="agree" required> أوافق على الشروط
    </label>
    <button type="submit">إرسال</button>
  </form>
</div>

<!-- Firebase libraries (compat) -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-analytics-compat.js"></script>

<script>
  // Firebase configuration
  const firebaseConfig = {
    apiKey: "AIzaSyD0TgGcjrNx4p9BrUg6RfADRcR7_7U92OI",
    authDomain: "talkandsolve-4ca7d.firebaseapp.com",
    databaseURL: "https://talkandsolve-4ca7d-default-rtdb.firebaseio.com",
    projectId: "talkandsolve-4ca7d",
    storageBucket: "talkandsolve-4ca7d.firebasestorage.app",
    messagingSenderId: "753365758409",
    appId: "1:753365758409:web:8a84f0f11467d1f001b818",
    measurementId: "G-Y0SDMHNYEZ"
  };

  // Initialize Firebase
  firebase.initializeApp(firebaseConfig);
  const database = firebase.database();
  const analytics = firebase.analytics();

  // Form submission
  const form = document.getElementById("problemForm");
  if (form) {
    form.addEventListener("submit", function(e){
      e.preventDefault();

      const agree = document.getElementById("agree");
      if (!agree.checked) {
        alert("يجب الموافقة على الشروط لإرسال المشكلة");
        return;
      }

      const name = document.getElementById("name").value || "مجهول";
      const type = document.getElementById("type").value || "";
      const description = document.getElementById("description").value || "";

      const newRef = database.ref("problems").push();
      newRef.set({
        name: name,
        type: type,
        description: description,
        createdAt: Date.now()
      }).then(() => {
        alert("تم الإرسال!");
        form.reset();
      }).catch(err => {
        console.error(err);
        alert("حدث خطأ أثناء الإرسال.");
      });
    });
  }
</script>

</body>
</html>
