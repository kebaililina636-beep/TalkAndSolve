<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>TalkAndSolve — حلول لمشاكلك اليومية</title>
<meta name="description" content="TalkAndSolve: شارك مشكلتك واحصل على حلول ونصائح عملية باللغة العربية." />

<!-- خطوط وأيقونات -->
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

<style>
/* كل الأنماط السابقة تبقى كما هي */
:root{
  --bg-start:#e9fbf6;
  --bg-end:#d9f6ef;
  --accent:#00a389;
  --accent-dark:#00796b;
  --muted:#4b6b66;
  --card:#ffffffdf;
  --radius:18px;
  --shadow: 0 20px 60px rgba(3,30,26,0.12);
  --soft-shadow: 0 10px 30px rgba(2,30,25,0.06);
  --success:#4caf50;
  --warning:#ff9800;
  --heart:#ff6b6b;
}

*{box-sizing:border-box}
html,body{height:100%;margin:0;font-family:'Cairo','Poppins',sans-serif;-webkit-font-smoothing:antialiased}
body{background:linear-gradient(180deg,var(--bg-start),var(--bg-end)); color:#053a35; overflow-x:hidden; transition: background 0.35s, color 0.35s;}

/* ... كل الأنماط السابقة تبقى كما هي ... */

</style>
</head>
<body class="light">

<!-- background decorations and bubbles -->
<div class="bg-decor" aria-hidden="true"></div>
<div class="bubbles" id="bubbles" aria-hidden="true"></div>
<div class="floating-hearts" id="floatingHearts"></div>

<!-- Hero -->
<section class="hero" aria-label="Welcome">
  <div class="hero-card" role="region" aria-label="Intro">
    <div class="hero-left">
      <h1 id="titleText">مرحبا في <span style="color:var(--accent)">TalkAndSolve</span>!</h1>
      <p id="subtitle">مكان هادئ وآمن لمشاركة مشاكلك والحصول على حلول بسيطة ومفيدة. اكتبي مشكلتك واحصلي على معرف لتتبع الحل.</p>

      <div class="cta-row" style="margin-top:12px">
        <button id="startBtn" class="btn btn-primary">
          <i class="fas fa-play-circle"></i>
          ابدئي الآن
        </button>
        <button id="langBtn" class="btn btn-ghost small">
          <i class="fas fa-language"></i>
          EN
        </button>
        <button id="toggleModeBtn" class="btn btn-ghost small">
          <i class="fas fa-sun"></i>
          الوضع: نهاري
        </button>
        <button class="heart-btn" id="heartBtn" title="أعجبني">
          <i class="far fa-heart"></i>
        </button>
      </div>
      
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </div>

    <div class="hero-right">
      <div class="preview" aria-hidden="true">
        <div class="screen">
          <h3><i class="fas fa-magic"></i> كيف نعمل؟</h3>
          <p>أرسلي مشكلتك بإيجاز، ستحصلين على معرف للمتابعة، والإدارة ستضيف حلاً يظهر هنا لاحقًا.</p>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- MAIN -->
<main class="main" id="formScreen" style="display:none">
  <div class="card">
    <h2 id="formTitle"><i class="fas fa-paper-plane"></i> أرسل مشكلتك</h2>
    <form id="problemForm" autocomplete="off">
      <div class="form-grid">
        <input id="name" class="input" placeholder="اسمك (اختياري)" />
        <input id="type" class="input" placeholder="نوع المشكلة (مثلاً: تنمر، خوف، خلاف)" required />
      </div>

      <textarea id="description" class="input" placeholder="صف المشكلة بإيجاز (حتى 250 حرف)" maxlength="250" required></textarea>

      <div class="controls">
        <label style="display:flex;align-items:center;gap:8px">
          <input id="agree" type="checkbox" />
          <span id="agreeText">أوافق على الشروط</span>
        </label>
        <div style="display:flex;gap:12px;align-items:center">
          <small id="charCount">0/250</small>
          <button type="submit" class="btn btn-primary">
            <i class="fas fa-paper-plane"></i>
            إرسال
          </button>
        </div>
      </div>
    </form>
  </div>

  <div class="card" style="margin-top:18px">
    <h3 id="checkTitle"><i class="fas fa-search"></i> عرض الحل</h3>
    <p id="checkHint">أدخلي معرف مشكلتك لتحصلي على الحل:</p>
    <div style="display:flex;gap:10px;align-items:center;margin-top:8px">
      <input id="checkKey" class="input" placeholder="ادخلي معرف المشكلة (مثال: 4F7A2B)" />
      <button id="checkBtn" class="btn btn-primary small">
        <i class="fas fa-eye"></i>
        عرض الحل
      </button>
    </div>
    <div id="solutionDisplay"></div>
  </div>
</main>

<script>
// الكود الأساسي المؤكد
document.addEventListener('DOMContentLoaded', function() {
    console.log('🚀 الصفحة محملة - جاهز للعمل!');
    
    // العناصر الأساسية (موجودة دائماً)
    const startBtn = document.getElementById('startBtn');
    const langBtn = document.getElementById('langBtn');
    const toggleModeBtn = document.getElementById('toggleModeBtn');
    const heartBtn = document.getElementById('heartBtn');
    const formScreen = document.getElementById('formScreen');
    const heroSection = document.querySelector('.hero');

    // ✅ تأكيد وجود العناصر
    if (!startBtn) { alert('❌ زر البدء غير موجود'); return; }
    if (!langBtn) { alert('❌ زر اللغة غير موجود'); return; }
    if (!toggleModeBtn) { alert('❌ زر الوضع غير موجود'); return; }
    if (!formScreen) { alert('❌ قسم النموذج غير موجود'); return; }

    console.log('✅ جميع العناصر الأساسية موجودة');

    // 1. زر البدء - بسيط ومضمون
    startBtn.addEventListener('click', function() {
        console.log('🎯 تم النقر على زر البدء');
        
        // إخفاء قسم البداية
        if (heroSection) {
            heroSection.style.display = 'none';
        }
        
        // إظهار النموذج
        formScreen.style.display = 'block';
        
        // تمرير سلس للأسفل
        window.scrollTo({
            top: formScreen.offsetTop,
            behavior: 'smooth'
        });
        
        showNotification('مرحبا بك! اكتبي مشكلتك الآن 🌸', 'success');
    });

    // 2. زر اللغة - التبديل بين العربية والإنجليزية
    let currentLang = 'ar';
    langBtn.addEventListener('click', function() {
        console.log('🌐 تم النقر على زر اللغة');
        
        if (currentLang === 'ar') {
            // التغيير إلى الإنجليزية
            currentLang = 'en';
            langBtn.innerHTML = '<i class="fas fa-language"></i> AR';
            document.getElementById('titleText').innerHTML = 'Welcome to <span style="color:var(--accent)">TalkAndSolve</span>!';
            document.getElementById('subtitle').textContent = 'A quiet and safe place to share your problems and get simple, useful solutions.';
            
            // تحديث النص في preview
            const previewTitle = document.querySelector('.preview h3');
            const previewDesc = document.querySelector('.preview p');
            if (previewTitle) previewTitle.innerHTML = '<i class="fas fa-magic"></i> How it works?';
            if (previewDesc) previewDesc.textContent = 'Send your problem briefly, get an ID for tracking, and admin will add a solution later.';
            
            startBtn.innerHTML = '<i class="fas fa-play-circle"></i> Start Now';
            
            // تحديث زر الوضع حسب اللغة
            if (document.body.classList.contains('dark')) {
                toggleModeBtn.innerHTML = '<i class="fas fa-moon"></i> Mode: Dark';
            } else {
                toggleModeBtn.innerHTML = '<i class="fas fa-sun"></i> Mode: Light';
            }
        } else {
            // العودة إلى العربية
            currentLang = 'ar';
            langBtn.innerHTML = '<i class="fas fa-language"></i> EN';
            document.getElementById('titleText').innerHTML = 'مرحبا في <span style="color:var(--accent)">TalkAndSolve</span>!';
            document.getElementById('subtitle').textContent = 'مكان هادئ وآمن لمشاركة مشاكلك والحصول على حلول بسيطة ومفيدة.';
            
            // تحديث النص في preview
            const previewTitle = document.querySelector('.preview h3');
            const previewDesc = document.querySelector('.preview p');
            if (previewTitle) previewTitle.innerHTML = '<i class="fas fa-magic"></i> كيف نعمل؟';
            if (previewDesc) previewDesc.textContent = 'أرسلي مشكلتك بإيجاز، ستحصلين على معرف للمتابعة، والإدارة ستضيف حلاً يظهر هنا لاحقًا.';
            
            startBtn.innerHTML = '<i class="fas fa-play-circle"></i> ابدئي الآن';
            
            // تحديث زر الوضع حسب اللغة
            if (document.body.classList.contains('dark')) {
                toggleModeBtn.innerHTML = '<i class="fas fa-moon"></i> الوضع: ليلي';
            } else {
                toggleModeBtn.innerHTML = '<i class="fas fa-sun"></i> الوضع: نهاري';
            }
        }
        
        showNotification(`تم التغيير إلى ${currentLang === 'ar' ? 'العربية' : 'English'} 🎯`, 'success');
    });

    // 3. زر الوضع الليلي/النهاري
    toggleModeBtn.addEventListener('click', function() {
        console.log('🌙 تم النقر على زر الوضع');
        
        const body = document.body;
        const isDark = body.classList.contains('dark');
        
        if (isDark) {
            // التغيير إلى الوضع النهاري
            body.classList.remove('dark');
            body.classList.add('light');
            if (currentLang === 'en') {
                toggleModeBtn.innerHTML = '<i class="fas fa-sun"></i> Mode: Light';
            } else {
                toggleModeBtn.innerHTML = '<i class="fas fa-sun"></i> الوضع: نهاري';
            }
            showNotification('تم التغيير إلى الوضع النهاري ☀️', 'success');
        } else {
            // التغيير إلى الوضع الليلي
            body.classList.remove('light');
            body.classList.add('dark');
            if (currentLang === 'en') {
                toggleModeBtn.innerHTML = '<i class="fas fa-moon"></i> Mode: Dark';
            } else {
                toggleModeBtn.innerHTML = '<i class="fas fa-moon"></i> الوضع: ليلي';
            }
            showNotification('تم التغيير إلى الوضع الليلي 🌙', 'success');
        }
    });

    // 4. زر الإعجاب
    heartBtn.addEventListener('click', function() {
        console.log('❤️ تم النقر على زر القلب');
        
        const icon = this.querySelector('i');
        this.classList.toggle('liked');
        
        if (this.classList.contains('liked')) {
            icon.className = 'fas fa-heart';
            showNotification('شكراً لحسن ظنك! 🤍', 'success');
        } else {
            icon.className = 'far fa-heart';
            showNotification('تم إزالة الإعجاب 💔', 'warning');
        }
    });

    // 5. شريط التقدم
    window.addEventListener('scroll', function() {
        const progressFill = document.getElementById('progressFill');
        if (progressFill) {
            const scrollable = document.documentElement.scrollHeight - window.innerHeight;
            const scrolled = (window.scrollY / scrollable) * 100;
            progressFill.style.width = Math.min(scrolled, 100) + '%';
        }
    });

    // دالة الإشعارات
    function showNotification(message, type = 'success') {
        // إنشاء إشعار جديد
        const notification = document.createElement('div');
        notification.className = `notification ${type} show`;
        notification.innerHTML = `
            <i class="fas fa-${type === 'success' ? 'check' : 'exclamation'}-circle"></i>
            <span>${message}</span>
        `;
        
        document.body.appendChild(notification);
        
        // إزالة الإشعار بعد 3 ثوان
        setTimeout(() => {
            notification.classList.remove('show');
            setTimeout(() => {
                if (notification.parentNode) {
                    notification.parentNode.removeChild(notification);
                }
            }, 300);
        }, 3000);
    }

    // إنشاء الفقاعات
    function createBubbles(n = 16) {
        const bubblesEl = document.getElementById('bubbles');
        if (!bubblesEl) return;
        
        for (let i = 0; i < n; i++) {
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            const size = Math.random() * 70 + 20;
            bubble.style.width = size + 'px';
            bubble.style.height = size + 'px';
            bubble.style.left = Math.random() * 100 + '%';
            bubble.style.animationDuration = (12 + Math.random() * 12) + 's';
            bubble.style.animationDelay = Math.random() * 6 + 's';
            bubble.style.opacity = 0.25 + Math.random() * 0.5;
            bubblesEl.appendChild(bubble);
        }
    }

    // إنشاء القلوب المتطايرة
    function createFloatingHearts() {
        const heartsContainer = document.getElementById('floatingHearts');
        if (!heartsContainer) return;
        
        for (let i = 0; i < 12; i++) {
            const heart = document.createElement('div');
            heart.className = 'heart';
            heart.innerHTML = '💖';
            heart.style.left = Math.random() * 100 + '%';
            heart.style.animationDelay = Math.random() * 8 + 's';
            heart.style.fontSize = (Math.random() * 20 + 16) + 'px';
            heartsContainer.appendChild(heart);
        }
    }

    // تشغيل التأثيرات
    createBubbles(20);
    createFloatingHearts();

    console.log('🎉 التطبيق جاهز تماماً!');
});

// إضافة أنماط الإشعارات
const notificationStyles = document.createElement('style');
notificationStyles.textContent = `
    .notification {
        position: fixed;
        top: 20px;
        right: 20px;
        padding: 12px 16px;
        border-radius: 10px;
        background: white;
        box-shadow: 0 20px 60px rgba(3,30,26,0.12);
        transform: translateX(150%);
        transition: transform 0.3s;
        z-index: 10000;
        display: flex;
        align-items: center;
        gap: 8px;
        border-left: 4px solid var(--success);
    }
    .notification.show {
        transform: translateX(0);
    }
    .notification.success {
        border-left-color: var(--success);
    }
    .notification.warning {
        border-left-color: var(--warning);
    }
    body.dark .notification {
        background: #1a1a1a;
        color: white;
    }
`;
document.head.appendChild(notificationStyles);
</script>
</body>
</html>
