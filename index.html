<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>موقع دعم المشكلات</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
body { font-family: Arial; background: #f0f8ff; padding: 20px; }
.container { max-width: 600px; margin: auto; background: #fff; padding: 20px; border-radius: 10px; }
textarea, input, button { width: 100%; padding: 10px; margin: 5px 0; font-size: 16px; }
.message-card { border: 1px solid #ddd; padding: 10px; margin: 10px 0; border-radius: 5px; }
.reply { background-color: #e0ffe0; padding: 5px; margin-top: 5px; border-radius: 5px; }
</style>
</head>
<body>
<div class="container">
<h1>اكتب مشكلتك</h1>

<p><strong>تنبيه:</strong> النصائح هنا ليست بديلاً عن مختص نفسي أو طبي. استخدمي الخدمة بمسؤوليتك الخاصة.</p>

<textarea id="userProblem" placeholder="اكتب مشكلتك هنا..."></textarea>
<input type="text" id="userName" placeholder="اسمك (اختياري)">
<input type="email" id="userEmail" placeholder="بريدك الإلكتروني (اختياري)">

<label>
  <input type="checkbox" id="consentBox">
  أوافق على أن تُرى معلوماتي من قبل الإدارة وأن النصائح غير احترافية.
</label>

<button id="sendBtn" disabled>إرسال</button>

<h2>الرسائل الواردة (لوحة الإدارة)</h2>
<div id="messages"></div>
</div>

<script>
// Import the functions you need from the SDKs you need
import { initializeApp } from "firebase/app";
import { getAnalytics } from "firebase/analytics";
// TODO: Add SDKs for Firebase products that you want to use
// https://firebase.google.com/docs/web/setup#available-libraries

// Your web app's Firebase configuration
// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyD0TgGcjrNx4p9BrUg6RfADRcR7_7U92OI",
  authDomain: "talkandsolve-4ca7d.firebaseapp.com",
  databaseURL: "https://talkandsolve-4ca7d-default-rtdb.firebaseio.com",
  projectId: "talkandsolve-4ca7d",
  storageBucket: "talkandsolve-4ca7d.firebasestorage.app",
  messagingSenderId: "753365758409",
  appId: "1:753365758409:web:8a84f0f11467d1f001b818",
  measurementId: "G-Y0SDMHNYEZ"
};

// Initialize Firebase
const app = initializeApp(firebaseConfig);
const analytics = getAnalytics(app);
// إعداد Firebase
const firebaseConfig = {
  apiKey: "API_KEY_HERE",
  authDomain: "PROJECT_ID.firebaseapp.com",
  databaseURL: "https://PROJECT_ID-default-rtdb.firebaseio.com",
  projectId: "PROJECT_ID",
  storageBucket: "PROJECT_ID.appspot.com",
  messagingSenderId: "SENDER_ID",
  appId: "APP_ID"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// تمكين الزر عند الموافقة
const consentBox = document.getElementById('consentBox');
const sendBtn = document.getElementById('sendBtn');
consentBox.addEventListener('change', () => sendBtn.disabled = !consentBox.checked);

// إرسال المشكلة إلى Firebase
sendBtn.addEventListener('click', () => {
  const problem = document.getElementById('userProblem').value.trim();
  const name = document.getElementById('userName').value.trim();
  const email = document.getElementById('userEmail').value.trim();

  if (!problem) { alert('من فضلك اكتبي مشكلتك'); return; }

  const newProblem = db.ref("problems").push();
  newProblem.set({
    problem: problem,
    name: name || "مجهول",
    email: email || "",
    reply: ""
  });

  document.getElementById('userProblem').value = "";
  document.getElementById('userName').value = "";
  document.getElementById('userEmail').value = "";
  consentBox.checked = false;
  sendBtn.disabled = true;

  alert('تم الإرسال! سيتم الرد عليك قريباً.');
});

// عرض الرسائل في لوحة الإدارة
const messagesDiv = document.getElementById("messages");
db.ref("problems").on("value", (snapshot) => {
  messagesDiv.innerHTML = "";
  const data = snapshot.val();
  if(data){
    Object.keys(data).forEach(key => {
      const msg = data[key];
      const card = document.createElement("div");
      card.className = "message-card";
      card.innerHTML = `<strong>المشكلة:</strong> ${msg.problem}<br>
                        <strong>الاسم:</strong> ${msg.name}<br>
                        <strong>البريد:</strong> ${msg.email || "غير محدد"}`;

      if(msg.reply) {
        const replyDiv = document.createElement("div");
        replyDiv.className = "reply";
        replyDiv.innerText = "النصيحة: " + msg.reply;
        card.appendChild(replyDiv);
      } else {
        const replyBtn = document.createElement("button");
        replyBtn.innerText = "إعطاء نصيحة";
        replyBtn.onclick = () => {
          const replyText = prompt("اكتبي نصيحتك هنا:");
          if(replyText && replyText.trim() !== ""){
            db.ref("problems/" + key).update({ reply: replyText.trim() });
          }
        };
        card.appendChild(replyBtn);
      }

      messagesDiv.appendChild(card);
    });
  }
});
</script>
</body>
</html>
