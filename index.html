<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TalkAndSolve — حلول لمشاكلك اليومية</title>
  <meta name="description" content="TalkAndSolve: شارك مشكلتك واحصلي على حلول ونصائح عملية باللغة العربية.">

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
    import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD0TgGcjrNx4p9BrUg6RfADRcR7_7U92OI",
      authDomain: "talkandsolve-4ca7d.firebaseapp.com",
      databaseURL: "https://talkandsolve-4ca7d-default-rtdb.firebaseio.com",
      projectId: "talkandsolve-4ca7d",
      storageBucket: "talkandsolve-4ca7d.appspot.com",
      messagingSenderId: "753365758409",
      appId: "1:753365758409:web:8a84f0f11467d1f001b818"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    document.addEventListener("DOMContentLoaded", () => {
      // نموذج المشاكل
      const form = document.getElementById("problemForm");
      form.addEventListener("submit", (e) => {
        e.preventDefault();
        const name = document.getElementById("name").value;
        const type = document.getElementById("type").value;
        const description = document.getElementById("description").value;
        const agree = document.getElementById("agree").checked;

        if (!agree) {
          alert("يجب الموافقة على الشروط قبل الإرسال!");
          return;
        }

        push(ref(db, "problems"), {
          name,
          type,
          description,
          date: new Date().toISOString()
        })
        .then(() => {
          const audio = document.getElementById("successSound");
          audio.play();
          alert("تم إرسال مشكلتك بنجاح!");
          form.reset();
        })
        .catch((err) => {
          alert("حدث خطأ أثناء الإرسال: " + err);
        });
      });

      // زر البدء مع تأثير fade
      const startBtn = document.getElementById("startBtn");
      const welcome = document.getElementById("welcomeScreen");
      const formScreen = document.getElementById("formScreen");

      startBtn.addEventListener("click", () => {
        document.getElementById("clickSound").play();
        welcome.style.opacity = 0;
        setTimeout(() => {
          welcome.style.display = "none";
          formScreen.style.display = "block";
          setTimeout(() => { formScreen.style.opacity = 1; }, 50);
        }, 500);
      });

      // نصوص متغيرة في الترحيب
      const texts = [
        "ارتاح واوجد حلول لمشاكلك العائلية.",
        "شارك مشاكلك الاجتماعية بسهولة.",
        "احصل على نصائح عملية للنفسية اليومية."
      ];
      let index = 0;
      const dynamicText = document.getElementById("dynamicText");
      setInterval(() => {
        index = (index + 1) % texts.length;
        dynamicText.style.opacity = 0;
        setTimeout(() => {
          dynamicText.textContent = texts[index];
          dynamicText.style.opacity = 1;
        }, 500);
      }, 4000);
    });
  </script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: linear-gradient(to bottom, #d0f0ea, #a8e0d0);
      color: #004d40;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      transition: background 0.5s ease;
    }

    .container {
      background: linear-gradient(to bottom, #ffffff, #e0f2f1);
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 500px;
      text-align: center;
      opacity: 1;
      transition: opacity 0.5s ease;
    }

    h1 {
      margin-bottom: 15px;
    }

    #dynamicText {
      font-size: 16px;
      margin-bottom: 25px;
      transition: opacity 0.5s ease;
    }

    button {
      padding: 12px 20px;
      background-color: #00695c;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    button:hover {
      background-color: #004d40;
      transform: scale(1.05);
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }

    input, textarea {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      border: 1px solid #a8e0d0;
      border-radius: 12px;
      font-size: 16px;
      background-color: #f0fdf9;
    }

    label {
      display: flex;
      align-items: center;
      font-size: 14px;
      margin-bottom: 15px;
    }

    label input {
      margin-right: 10px;
    }

    #formScreen {
      display: none;
      opacity: 0;
    }
  </style>
</head>
<body>
  <!-- أصوات -->
  <audio id="clickSound" src="https://www.soundjay.com/buttons/sounds/button-16.mp3"></audio>
  <audio id="successSound" src="https://www.soundjay.com/buttons/sounds/button-3.mp3"></audio>

  <!-- شاشة الترحيب -->
  <div id="welcomeScreen" class="container">
    <h1>مرحبا بك في TalkAndSolve!</h1>
    <p id="dynamicText">ارتاح واوجد حلول لمشاكلك العائلية.</p>
    <button id="startBtn">ابدأ الآن</button>
  </div>

  <!-- شاشة نموذج المشاكل -->
  <div id="formScreen" class="container">
    <h1>أرسل مشكلتك</h1>
    <form id="problemForm">
      <input type="text" id="name" placeholder="اسمك" required>
      <input type="text" id="type" placeholder="نوع المشكلة" required>
      <textarea id="description" placeholder="صف المشكلة" required></textarea>
      <label>
        <input type="checkbox" id="agree" required> أوافق على الشروط
      </label>
      <button type="submit">إرسال</button>
    </form>
  </div>
</body>
</html>
