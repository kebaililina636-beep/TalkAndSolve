<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Talk And Solve</title>

    <style>
        :root {
            --bg-light: linear-gradient(to top, #fdfbfb, #ebedee);
            --bg-dark: #0a0a0a;
            --text-light: #000;
            --text-dark: #fff;
            --card-bg-light: #fff;
            --card-bg-dark: rgba(255, 255, 255, 0.05);
            --accent: #ff4f7b;
            --accent-hover: #ff335f;
        }

        body {
            margin: 0;
            font-family: 'Arial', sans-serif;
            background: var(--bg-light);
            color: var(--text-light);
            transition: 0.4s ease-in-out;
            overflow-x: hidden;
        }

        body.dark-mode {
            background: var(--bg-dark);
            color: var(--text-dark);
        }

        .container {
            width: 92%;
            max-width: 850px;
            margin: auto;
            padding: 15px 0;
        }

        .hero {
            text-align: center;
            padding: 55px 12px;
            position: relative;
            overflow: hidden;
            border-radius: 20px;
            margin-bottom: 25px;
            background: linear-gradient(to right, #fdfbfb, #ebedee);
            transition: 0.4s;
        }

        body.dark-mode .hero {
            background: #111;
        }

        #floatingHearts {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
        }

        .hero-left h1 {
            font-size: 32px;
            margin-bottom: 10px;
            animation: fadeInDown 0.8s ease-out;
            position: relative;
        }

        .hero-left h1::after {
            content: '✨';
            position: absolute;
            margin-right: 8px;
            animation: sparkle 1.5s infinite alternate;
            aria-hidden: true;
        }

        @keyframes sparkle {
            from { opacity: 0.2; transform: scale(1); }
            to   { opacity: 1; transform: scale(1.2); }
        }

        .hero-left p {
            font-size: 18px;
            opacity: 0.85;
            animation: fadeInUp 1s ease-out;
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .button-group {
            margin-top: 20px;
        }

        .btn {
            padding: 12px 24px;
            border-radius: 12px;
            background: var(--accent);
            border: none;
            font-size: 18px;
            cursor: pointer;
            margin: 8px;
            color: white;
            transition: 0.3s;
        }

        .btn:hover {
            background: var(--accent-hover);
            transform: scale(1.05);
        }

        .card {
            background: var(--card-bg-light);
            padding: 20px;
            border-radius: 14px;
            margin-top: 25px;
            box-shadow: 0px 0px 14px rgba(0,0,0,0.1);
            transition: 0.3s;
        }

        body.dark-mode .card {
            background: var(--card-bg-dark);
            backdrop-filter: blur(6px);
        }

        textarea {
            width: 100%;
            min-height: 120px;
            padding: 12px;
            border-radius: 10px;
            border: 1.4px solid #ccc;
            margin-bottom: 10px;
            resize: vertical;
            font-size: 16px;
        }

        textarea:focus {
            outline: none;
            border-color: var(--accent);
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(0,0,0,0.1);
            border-radius: 10px;
            overflow: hidden;
            margin-top: 25px;
        }

        .progress {
            width: 3%;
            height: 8px;
            background: var(--accent);
            transition: width 0.2s linear;
        }

        #toast {
            position: fixed;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--accent);
            color: white;
            padding: 12px 20px;
            border-radius: 10px;
            opacity: 0;
            pointer-events: none;
            transition: 0.4s;
            z-index: 1000;
            font-size: 16px;
        }

        .admin-panel {
            padding: 15px;
            background: rgba(255,255,255,0.6);
            border-radius: 14px;
            margin-top: 25px;
        }

        body.dark-mode .admin-panel {
            background: rgba(255,255,255,0.06);
        }

        .hide { display: none; }

        .solutionCard {
            background: #fff3f7;
            padding: 12px;
            border-radius: 10px;
            border-left: 5px solid var(--accent);
            margin-top: 12px;
        }

        body.dark-mode .solutionCard {
            background: rgba(255,255,255,0.07);
        }

        #idModal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.65);
            display:none;
            justify-content:center;
            align-items:center;
            z-index:1000;
        }

        #idModalBox {
            background:#fff;
            padding:20px;
            border-radius:12px;
            max-width:320px;
            width:90%;
            text-align:center;
        }

        body.dark-mode #idModalBox {
            background: #222;
            color: white;
        }

        .tagline {
            background: rgba(255,255,255,0.5);
            padding: 8px 16px;
            margin-top: 28px;
            border-radius: 12px;
            display: inline-block;
            font-size: 15.5px;
        }

        body.dark-mode .tagline {
            background: rgba(255,255,255,0.08);
        }

        @keyframes floatBubble {
            from { transform: translateY(0) scale(1); opacity: 0.8; }
            to   { transform: translateY(-120px) scale(1.2); opacity: 0; }
        }

        .bubble {
            width: 8px;
            height: 8px;
            background: rgba(255,79,123,0.7);
            border-radius: 50%;
            position: absolute;
            bottom: 0;
            animation: floatBubble 4s linear infinite;
        }

        #bubbleContainer {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 120px;
            overflow: hidden;
        }

    </style>
</head>

<body>

<div id="toast" aria-live="polite"></div>

<div class="container">

    <div class="hero" id="heroSection">
        <div id="floatingHearts"></div>

        <h1>Talk And Solve</h1>
        <p>منصة لطرح مشاكلكِ بسرية تامة والحصول على حل.</p>

        <div class="button-group">
            <button class="btn" id="startBtn">ابدئي الآن</button>
        </div>

        <div id="bubbleContainer"></div>
    </div>

    <div id="problemSection" class="hide">
        <div class="card">
            <h2>أرسلي مشكلتك</h2>

            <form id="problemForm">
                <label>اسمك (اختياري):</label>
                <input type="text" id="name" placeholder="اسمك...">

                <label>نوع المشكلة:</label>
                <input type="text" id="type" placeholder="مثال: صداقة / علاقة / عائلة">

                <label>مشكلتك (بتفصيل):</label>
                <textarea id="description" maxlength="250"></textarea>

                <div id="charCount" style="text-align:left;font-size:14px;opacity:0.7;">0/250</div>

                <br>
                <button class="btn" type="submit">إرسال</button>
            </form>
        </div>
    </div>

    <div class="progress-bar">
        <div class="progress"></div>
    </div>

    <div class="card">
        <h2>عرض حل مشكلتك</h2>
        <input type="text" id="checkKey" placeholder="اكتبي المعرف" style="width:100%;padding:10px;border-radius:8px;border:1px solid #ccc;">
        <button class="btn" id="checkBtn">عرض الحل</button>

        <div id="solutionDisplay" style="margin-top:12px;"></div>
    </div>

    <div class="admin-panel hide" id="adminArea">
        <h2>منطقة الإدارة</h2>
        <form id="adminForm">
            <label>معرف المشكلة:</label>
            <input type="text" id="problemKey" style="width:100%;padding:10px;border-radius:8px;border:1px solid #ccc;">

            <label>اكتبي الحل:</label>
            <textarea id="solutionText"></textarea>

            <button class="btn" type="submit">نشر الحل</button>
        </form>

        <button class="btn" id="closeAdminBtn" type="button" style="margin-top:10px;background:#666;">إغلاق</button>
    </div>

    <p class="tagline">خصوصيتك أولويتنا — لا يتم تخزين أي بيانات شخصية.</p>

</div>


<!-- المودال -->
<div id="idModal">
    <div id="idModalBox">
        <h3>تم الإرسال بنجاح!</h3>
        <p>احتفظي بالمعرف التالي لعرض الحل:</p>

        <input id="lastIdInput" readonly style="padding:10px;width:90%;border-radius:8px;border:1px solid #ccc;text-align:center;font-size:18px;margin-top:10px;">
        
        <button class="btn" id="copyIdBtn" type="button" style="width:90%;margin-top:12px;">نسخ المعرف</button>
        <button class="btn" id="closeIdBtn" type="button" style="width:90%;margin-top:8px;background:#777;">إغلاق</button>
    </div>
</div>



<script>
/* ========== TOOLS ========== */

const $ = id => document.getElementById(id);

function showToast(msg) {
    const toast = $("toast");
    toast.textContent = msg;
    toast.style.opacity = "1";
    setTimeout(() => toast.style.opacity = "0", 2200);
}

function makeId(len = 6) {
    const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
    let out = "";
    for (let i = 0; i < len; i++) {
        out += chars.charAt(Math.floor(Math.random() * chars.length));
    }
    return out;
}

function escapeHtml(str) {
    return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
}

/* ========== STORAGE MOCKUP ========== */

function saveProblem(p) {
    const db = JSON.parse(localStorage.getItem("talk_db") || "{}");
    db[p.id] = p;
    localStorage.setItem("talk_db", JSON.stringify(db));
}

function getProblem(id) {
    const db = JSON.parse(localStorage.getItem("talk_db") || "{}");
    return db[id] || null;
}

/* ========== UI ========== */

const hero = $("heroSection");
const problemSection = $("problemSection");
const progressBar = document.querySelector(".progress");

$("startBtn").addEventListener("click", () => {
    hero.classList.add("hide");
    problemSection.classList.remove("hide");
    $("name").focus();
});

/* ========== BUBBLES ========== */
function createBubbles() {
    const container = $("bubbleContainer");
    setInterval(() => {
        const b = document.createElement("span");
        b.classList.add("bubble");
        b.style.left = Math.random() * 100 + "%";
        b.style.animationDuration = (3 + Math.random() * 3) + "s";
        container.appendChild(b);
        setTimeout(() => b.remove(), 6000);
    }, 600);
}
createBubbles();

/* ========== HEARTS ========== */
function createFloatingHearts() {
    const cont = $("floatingHearts");
    setInterval(() => {
        const h = document.createElement("div");
        h.innerHTML = "❤";
        h.style.position = "absolute";
        h.style.fontSize = "16px";
        h.style.left = Math.random() * 100 + "%";
        h.style.top = Math.random() * 100 + "%";
        h.style.opacity = "0.8";
        h.style.animation = "floatHeart 4s linear forwards";
        cont.appendChild(h);
        setTimeout(() => h.remove(), 4000);
    }, 1400);
}
createFloatingHearts();

/* ========== PROGRESS BAR FIX ========== */
window.addEventListener("scroll", () => {
    const scrollable = document.documentElement.scrollHeight - innerHeight;
    let progress = 0;
    if (scrollable > 0) progress = (scrollY / scrollable) * 100;
    progressBar.style.width = progress + "%";
});

/* ========== CHARACTER COUNT ========== */
$("description").addEventListener("input", () => {
    $("charCount").textContent = `${$("description").value.length}/250`;
});

/* ========== SUBMIT PROBLEM ========== */
$("problemForm").addEventListener("submit", e => {
    e.preventDefault();

    const type = $("type").value.trim();
    const desc = $("description").value.trim();

    if (!type || !desc) {
        showToast("يرجى ملء الحقول المطلوبة");
        return;
    }

    const id = makeId();
    const p = {
        id,
        name: $("name").value.trim() || "مجهولة",
        type,
        desc,
        created: new Date().toISOString(),
        solution: null
    };

    saveProblem(p);

    $("lastIdInput").value = id;
    $("idModal").style.display = "flex";

    showToast("تم الإرسال — احتفظي بالمعرّف!");
});

/* ========== COPY ID ========== */
$("copyIdBtn").addEventListener("click", () => {
    navigator.clipboard.writeText($("lastIdInput").value);
    showToast("تم النسخ!");
});

/* ========== CLOSE MODAL ========== */
$("closeIdBtn").addEventListener("click", () => {
    $("idModal").style.display = "none";
});

/* ========== CHECK SOLUTION ========== */
$("checkBtn").addEventListener("click", () => {
    const key = $("checkKey").value.trim().toUpperCase();
    if (!key) return showToast("اكتبي المعرف");

    const p = getProblem(key);
    const box = $("solutionDisplay");

    if (!p) {
        box.innerHTML = `<div class='solutionCard'>لا يوجد مشكلة بهذا المعرف.</div>`;
        return;
    }

    if (!p.solution) {
        box.innerHTML = `<div class='solutionCard'>لم يتم نشر حل بعد. احتفظي بالمعرف: <b>${p.id}</b></div>`;
        return;
    }

    box.innerHTML = `
        <div class="solutionCard">
            <b>الحل:</b><br><br>
            ${escapeHtml(p.solution)}
        </div>
    `;
});

/* ========== ADMIN PANEL (CTRL+SHIFT+A) ========== */
document.addEventListener("keydown", e => {
    if (e.ctrlKey && e.shiftKey && e.key === "A") {
        $("adminArea").classList.toggle("hide");
        showToast("تم فتح الإدارة (مؤقت للتطوير)");
    }
});

$("adminForm").addEventListener("submit", e => {
    e.preventDefault();

    const id = $("problemKey").value.trim().toUpperCase();
    const sol = $("solutionText").value.trim();

    if (!id || !sol) return showToast("أكملي الحقول");

    const p = getProblem(id);
    if (!p) return showToast("المشكلة غير موجودة");

    p.solution = sol;
    saveProblem(p);

    showToast("تم نشر الحل");

    $("checkKey").value = id;
    $("checkBtn").click();
});

/* CLOSE ADMIN */
$("closeAdminBtn").addEventListener("click", () => {
    $("adminArea").classList.add("hide");
});

</script>

</body>
</html>
