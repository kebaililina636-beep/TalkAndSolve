<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Talk And Solve - نسخة مصححة</title>
<style>
/* ====== RESET ====== */
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Tajawal', sans-serif;
  background: #f2f8ff;
  color: #2c3e50;
  overflow-x: hidden;
  line-height: 1.6;
}

:root {
  --primary: #0077b6;
  --secondary: #00b4d8;
  --accent: #90e0ef;
  --light: #caf0f8;
  --danger: #d90429;
  --success: #2a9d8f;
}

/* ====== COPY BUTTON ====== */
.copy-btn {
  background: var(--primary);
  color: #fff;
  border: none;
  padding: 6px 12px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
}
.copy-btn:hover { background: var(--secondary); }

/* ====== FLOATING HEARTS ====== */
.floating-hearts {
  position: fixed;
  bottom: 20px;
  left: 20px;
  display: flex;
  gap: 5px;
  z-index: 10;
}
.heart {
  font-size: 22px;
  animation: float 3s infinite ease-in-out;
}
@keyframes float {
  0% { transform: translateY(0); opacity: 1; }
  50% { transform: translateY(-10px); opacity: 0.7; }
  100% { transform: translateY(0); opacity: 1; }
}

/* ====== PROGRESS BAR ====== */
.progress-container {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 5px;
  background: rgba(0,0,0,0.1);
  z-index: 9999;
}
.progress-bar {
  height: 100%;
  width: 0%;
  background: var(--primary);
  transition: width 0.2s ease;
}

/* ====== NAVIGATION ====== */
nav {
  width: 100%;
  padding: 15px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: #fff;
  border-bottom: 1px solid #eee;
}
nav .logo { font-size: 20px; font-weight: bold; color: var(--primary); }
nav button {
  padding: 8px 14px;
  border-radius: 10px;
  border: none;
  background: var(--secondary);
  color: #fff;
  cursor: pointer;
  font-size: 14px;
}

/* ====== HERO SECTION ====== */
.hero {
  padding: 50px 20px;
  text-align: center;
}
.hero-left { margin-bottom: 20px; }
.hero h1 {
  font-size: 32px;
  font-weight: bold;
  color: var(--primary);
  position: relative;
}
.hero h1::after {
  content: "✨";
  margin-right: 8px;
  opacity: 0.8;
}
.hero p { font-size: 16px; color: #555; margin: 15px 0; }
.hero button {
  padding: 12px 20px;
  font-size: 16px;
  background: var(--primary);
  color: #fff;
  border: none;
  border-radius: 10px;
  cursor: pointer;
}
.hero button:hover { background: var(--secondary); }
.hero-image { text-align: center; }
.hero-image img { width: 70%; max-width: 350px; }

/* ====== CONTENT SECTIONS ====== */
.content-section { display: none; padding: 40px 20px; }
.container {
  background: #fff;
  padding: 25px;
  border-radius: 15px;
  max-width: 800px;
  margin: auto;
  box-shadow: 0 4px 10px rgba(0,0,0,0.05);
}

/* ====== FORM ====== */
input, select, textarea {
  width: 100%;
  padding: 10px;
  border: 1px solid #ccc;
  border-radius: 8px;
  margin-top: 5px;
  font-size: 14px;
}
textarea { resize: none; height: 120px; }
label { font-weight: bold; margin-top: 10px; display: block; }
#charCount { font-size: 13px; color: #555; margin-top: 5px; }

button[type="submit"] {
  background: var(--primary);
  color: #fff;
  padding: 12px;
  border-radius: 10px;
  border: none;
  cursor: pointer;
  width: 100%;
  margin-top: 15px;
  font-size: 16px;
}
button[type="submit"]:hover { background: var(--secondary); }

/* ====== MODAL ====== */
#idModal {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.5);
  z-index: 99999;
  padding-top: 80px;
}
#idModal .card {
  background: #fff;
  width: 90%;
  max-width: 400px;
  padding: 25px;
  margin: auto;
  border-radius: 15px;
  text-align: center;
}

/* ====== NOTIFICATIONS ====== */
.notification {
  position: fixed;
  bottom: 20px;
  right: 20px;
  background: var(--primary);
  color: white;
  padding: 12px 18px;
  border-radius: 8px;
  animation: slideIn .4s ease;
  z-index: 99999;
}
@keyframes slideIn {
  from { transform: translateX(100px); opacity: 0; }
  to { transform: translateX(0); opacity: 1; }
}

/* ====== ADMIN ====== */
#adminArea {
  display: none;
  background: #fff;
  padding: 20px;
  margin: 20px auto;
  max-width: 600px;
  border-radius: 15px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.1);
}
.hide { display: none !important; }
</style>
</head>
<body>

<!-- === Floating Hearts === -->
<div class="floating-hearts">
  <span class="heart">💙</span>
  <span class="heart">💙</span>
  <span class="heart">💙</span>
</div>

<!-- === Progress Bar === -->
<div class="progress-container"><div class="progress-bar" id="progressBar"></div></div>

<!-- === NAVBAR === -->
<nav>
  <div class="logo">Talk & Solve 🔧</div>
  <button id="langBtn">EN</button>
</nav>

<!-- === HERO SECTION === -->
<section id="heroSection" class="hero">
  <div class="hero-left">
    <h1>أهلاً في Talk And Solve 💙</h1>
    <p>اكتبي مشكلتك بكل أمان، وخلي بالكرتون الزرق يحلّها لكِ بسرعة وبأسلوب لطيف.</p>
    <button id="startBtn">ابدئي الآن 🚀</button>
  </div>
  <div class="hero-image">
    <img src="https://media1.tenor.com/m/xVkT-2zaZx8AAAAd/blue-cat-blue.gif" />
  </div>
</section>

<!-- === Steps Content === -->
<section id="step1" class="content-section">
  <div class="container">
    <h2>✨ اكتبي مشكلتك</h2>
    <form id="problemForm">
      <label>اسمك (اختياري):</label>
      <input type="text" id="name" placeholder="اكتبي اسمك هنا..." />

      <label>نوع المشكلة:</label>
      <select id="type" required>
        <option value="">اختاري النوع</option>
        <option value="اجتماعية">اجتماعية</option>
        <option value="نفسية">نفسية</option>
        <option value="عاطفية">عاطفية</option>
        <option value="أخرى">أخرى</option>
      </select>

      <label>وصف المشكلة (بحد أقصى 250 حرف):</label>
      <textarea id="description" maxlength="250" placeholder="اكتبي مشكلتك هنا..." required></textarea>
      <div id="charCount">0/250</div>

      <label>
        <input type="checkbox" id="agree" />
        أوافق على معالجة المشكلة.
      </label>

      <button type="submit">إرسال المشكلة</button>
    </form>
  </div>
</section>

<section id="step2" class="content-section">
  <div class="container">
    <h2>🔎 عرض الحل</h2>
    <p>أدخلي معرف المشكلة لرؤية الحل:</p>
    <input type="text" id="checkKey" placeholder="مثل: A1B2C3" />
    <button id="checkBtn" class="solution">عرض الحل</button>
    <div id="solutionDisplay" class="mt20"></div>
  </div>
</section>

<!-- === ID MODAL === -->
<div id="idModal" role="dialog" aria-modal="true" aria-hidden="true">
  <div class="card">
    <h3>🎉 تم تسجيل مشكلتك!</h3>
    <p>هذا هو المعرف الخاص بك — احتفظي به:</p>
    <p><strong>لا تشاركيه مع أحد</strong></p>
    <input type="text" id="lastIdInput" readonly style="text-align:center;font-weight:bold;font-size:18px;margin:10px 0;" />
    <button id="copyIdBtn" class="copy-btn">نسخ</button>
    <br /><br />
    <button id="closeIdBtn">إغلاق</button>
  </div>
</div>

<!-- === ADMIN AREA === -->
<div id="adminArea">
  <h3>لوحة الإدارة 🛠️</h3>
  <form id="adminForm">
    <label>معرف المشكلة:</label>
    <input type="text" id="problemKey" placeholder="A1B2C3" />
    <label>الحل:</label>
    <textarea id="solutionText" placeholder="اكتب الحل هنا..."></textarea>
    <button type="submit">حفظ الحل</button>
  </form>
  <button id="closeAdminBtn">إخفاء</button>
</div>

<script>
/* ====== PROGRESS BAR ====== */
const progressBar = document.getElementById('progressBar');
window.addEventListener('scroll', () => {
  const scrollable = document.documentElement.scrollHeight - window.innerHeight;
  if (scrollable > 0) {
    progressBar.style.width = (window.scrollY / scrollable) * 100 + '%';
  } else {
    progressBar.style.width = '0%';
  }
});

/* ====== STEP SYSTEM ====== */
const steps = ['step1', 'step2'];
let currentStep = 0;
function showStep(i) {
  steps.forEach((id, idx) => {
    document.getElementById(id).style.display = idx === i ? 'block' : 'none';
  });
  document.getElementById('heroSection').style.display = 'none';
}

document.getElementById('startBtn').onclick = () => {
  showStep(0);
};

document.getElementById('nextBtn')?.onclick = () => {
  currentStep = Math.min(currentStep + 1, steps.length - 1);
  showStep(currentStep);
};

document.getElementById('prevBtn')?.onclick = () => {
  currentStep = Math.max(currentStep - 1, 0);
  showStep(currentStep);
};

/* ====== CHAR COUNTER ====== */
const descInput = document.getElementById('description');
const charCount = document.getElementById('charCount');
descInput.addEventListener('input', () => {
  charCount.textContent = `${descInput.value.length}/250`;
});

/* ====== NOTIFICATION ====== */
function showNotification(msg, type='info') {
  const n = document.createElement('div');
  n.className = 'notification';
  n.style.background = type === 'success' ? 'var(--success)' : type === 'warning' ? 'var(--danger)' : 'var(--primary)';
  n.textContent = msg;
  document.body.appendChild(n);
  setTimeout(() => n.remove(), 3000);
}

/* ====== FAKE BACKEND (localStorage) ====== */
function makeId(length=6) {
  const chars = 'ABCDEFGHJKLMNPQRTUVWXYZ23456789';
  let out = '';
  for (let i = 0; i < length; i++) out += chars[Math.floor(Math.random() * chars.length)];
  return out;
}
function saveProblem(p) {
  const db = JSON.parse(localStorage.getItem('problems') || '{}');
  db[p.id] = p;
  localStorage.setItem('problems', JSON.stringify(db));
}
function getProblem(id) {
  const db = JSON.parse(localStorage.getItem('problems') || '{}');
  return db[id] || null;
}
function escapeHtml(str) {
  return str.replace(/[&<>"']/g, m => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'
  }[m]));
}

/* ====== SUBMIT PROBLEM ====== */
const problemForm = document.getElementById('problemForm');
const idModal = document.getElementById('idModal');
const lastIdInput = document.getElementById('lastIdInput');

problemForm.addEventListener('submit', e => {
  e.preventDefault();
  const type = document.getElementById('type').value.trim();
  const desc = document.getElementById('description').value.trim();
  if (!type || !desc) {
    showNotification('املئي الحقول المطلوبة', 'warning');
    return;
  }
  const id = makeId();
  saveProblem({
    id,
    name: document.getElementById('name').value.trim() || 'مجهولة',
    type,
    description: desc,
    solution: null,
    created: new Date().toISOString()
  });
  lastIdInput.value = id;
  idModal.style.display = 'block';
  idModal.setAttribute('aria-hidden', 'false');
  lastIdInput.select();
  showNotification('تم تسجيل المشكلة بنجاح', 'success');
  problemForm.reset();
  charCount.textContent = "0/250";
});

document.getElementById('copyIdBtn').onclick = () => {
  navigator.clipboard.writeText(lastIdInput.value).then(() => {
    showNotification('تم نسخ المعرف', 'success');
  });
};
document.getElementById('closeIdBtn').onclick = () => {
  idModal.style.display = 'none';
  idModal.setAttribute('aria-hidden', 'true');
};

/* ====== CHECK SOLUTION ====== */
const checkBtn = document.getElementById('checkBtn');
const solutionDisplay = document.getElementById('solutionDisplay');
checkBtn.onclick = () => {
  const key = document.getElementById('checkKey').value.trim().toUpperCase();
  const p = getProblem(key);
  if (!p) {
    solutionDisplay.innerHTML = '<div class="card">لا يوجد مشكلة بهذا المعرف</div>';
    return;
  }
  if (!p.solution) {
    solutionDisplay.innerHTML = `<div class='card'>لم يتم نشر حل بعد. المعرف: <strong>${p.id}</strong></div>`;
  } else {
    solutionDisplay.innerHTML = `<div class='card'><h3>الحل:</h3><p>${escapeHtml(p.solution)}</p></div>`;
  }
};

/* ====== ADMIN PANEL (Ctrl+Shift+A) ====== */
const adminArea = document.getElementById('adminArea');
document.addEventListener('keydown', e => {
  if (e.ctrlKey && e.shiftKey && e.key === 'A') {
    adminArea.style.display = adminArea.style.display === 'block' ? 'none' : 'block';
  }
});

document.getElementById('adminForm').onsubmit = e => {
  e.preventDefault();
  const key = document.getElementById('problemKey').value.trim().toUpperCase();
  const sol = document.getElementById('solutionText').value.trim();
  const p = getProblem(key);
  if (!p) return showNotification('المعرف غير موجود', 'warning');
  p.solution = sol;
  saveProblem(p);
  showNotification('تم حفظ الحل', 'success');
};

document.getElementById('closeAdminBtn').onclick = () => {
  adminArea.style.display = 'none';
};
</script>
</body>
</html>
