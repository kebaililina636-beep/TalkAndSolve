<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TalkAndSolve — حلول لمشاكلك اليومية</title>
<meta name="description" content="TalkAndSolve: شارك مشكلتك واحصل على حلول ونصائح عملية باللغة العربية.">

<style>
/* --- عام --- */
body, html {
  margin:0; padding:0; font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  overflow-x:hidden;
  transition: background 0.5s, color 0.5s;
}

/* --- Dark/Light Mode --- */
body.light { background: linear-gradient(135deg,#d0f0ea,#a8e0d0); color:#004d40; }
body.dark { background: #001f1f; color:#a0e0d0; }

/* --- خلفية الفيديو --- */
#bgVideo { position: fixed; top:0; left:0; width:100%; height:100%; object-fit:cover; z-index:-2; }

/* --- فقاعات خلفية --- */
.bubbles { position:fixed; width:100%; height:100%; top:0; left:0; overflow:hidden; z-index:-1; }
.bubble { position:absolute; bottom:-150px; background-color: rgba(0,150,136,0.3); border-radius:50%; opacity:0.6; animation: rise 20s infinite; }
@keyframes rise { 0% {transform: translateY(0) rotate(0deg);} 100% {transform: translateY(-1200px) rotate(720deg);} }

/* --- الحاوية --- */
.container { background: rgba(255,255,255,0.9); border-radius:25px; padding:30px 25px; max-width:600px; width:90%; display:flex; flex-direction:column; align-items:center; text-align:center; box-shadow:0 10px 30px rgba(0,0,0,0.2); margin:20px auto; box-sizing:border-box; transition: background 0.5s, color 0.5s; }
body.dark .container { background: rgba(0,0,0,0.7); }

/* --- النصوص --- */
h1 { margin-bottom:15px; font-size:28px; }
#dynamicText { font-size:18px; margin-bottom:25px; transition: opacity 0.5s ease; }
.fadeOutText { opacity:0; }

/* --- النماذج --- */
form { display:grid; grid-gap:15px; width:100%; box-sizing:border-box; }
input, textarea { padding:12px 35px 12px 12px; border-radius:12px; border:1px solid #a8e0d0; font-size:16px; background-color:#f0fdf9; width:100%; resize:vertical; box-sizing:border-box; background-repeat:no-repeat; background-position:right 10px center; background-size:20px; }
body.dark input, body.dark textarea { background-color:#003030; border:1px solid #00695c; color:#a0e0d0; }
textarea { min-height:80px; }
label { display:flex; align-items:center; font-size:14px; gap:10px; }
button { padding:12px 0; border-radius:12px; border:none; background: linear-gradient(to right, #009688, #00695c); color:#fff; font-size:18px; cursor:pointer; transition: all 0.3s ease; }
button:hover { transform:scale(1.05); box-shadow:0 8px 25px rgba(0,0,0,0.25); }

/* --- شاشات --- */
#welcomeScreen { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; padding:20px; }
#formScreen { display:none; flex-direction:column; align-items:center; justify-content:flex-start; padding:40px 20px; opacity:0; }

/* --- Fade --- */
.fadeOut { animation:fadeOut 0.7s forwards; }
.fadeIn { animation:fadeIn 0.7s forwards; }
@keyframes fadeOut { to { opacity:0; transform:translateY(-20px); } }
@keyframes fadeIn { to { opacity:1; transform:translateY(0); } }

/* --- بطاقة الحل --- */
.solutionCard { background: #e0f2f1; border-radius:15px; padding:15px; margin-top:15px; color:#004d40; animation:slideIn 0.7s ease; }
body.dark .solutionCard { background:#004d40; color:#a0e0d0; }
@keyframes slideIn { from {opacity:0; transform:translateY(20px);} to {opacity:1; transform:translateY(0);} }

/* --- إشعارات قصيرة --- */
.toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background: #009688; color:#fff; padding:12px 20px; border-radius:25px; opacity:0; pointer-events:none; transition:opacity 0.5s; z-index:9999; }

/* --- استجابة --- */
@media (max-width:600px){ 
  .container{padding:25px 15px;} 
  h1{font-size:24px;} 
  #dynamicText{font-size:16px;} 
  button{font-size:16px;} 
}
</style>
</head>
<body class="light">

<video id="bgVideo" autoplay muted loop>
  <source src="https://www.videvo.net/videvo_files/converted/2017_04/preview/170404_01_Drone_View.mp452527.webm" type="video/webm">
</video>

<div class="bubbles"></div>

<audio id="clickSound" src="https://www.soundjay.com/buttons/sounds/button-16.mp3"></audio>
<audio id="successSound" src="https://www.soundjay.com/buttons/sounds/button-3.mp3"></audio>
<audio id="solutionSound" src="https://www.soundjay.com/button/sounds/button-09.mp3"></audio>
<audio id="backgroundMusic" src="https://www.bensound.com/bensound-music/bensound-dreams.mp3" loop></audio>

<!-- شاشة الترحيب -->
<div id="welcomeScreen" class="container">
<h1>مرحبا بك في TalkAndSolve!</h1>
<p id="dynamicText">ارتاح واوجد حلول لمشاكلك العائلية.</p>
<button id="startBtn">ابدأ الآن</button>
<button id="toggleModeBtn" style="margin-top:10px;">تبديل الوضع الليلي/النهاري</button>
</div>

<!-- شاشة نموذج المشاكل -->
<div id="formScreen" class="container">
<h1>أرسل مشكلتك</h1>
<form id="problemForm">
<input type="text" id="name" placeholder="اسمك" required>
<input type="text" id="type" placeholder="نوع المشكلة" required>
<textarea id="description" placeholder="صف المشكلة" rows="5" maxlength="250" required></textarea>
<label><input type="checkbox" id="agree" required> أوافق على الشروط</label>
<button type="submit">إرسال</button>
</form>

<h2>عرض الحلول</h2>
<p>لرؤية الحل، أدخل معرف مشكلتك:</p>
<input id="checkKey" placeholder="ادخل معرف المشكلة">
<button id="checkBtn">عرض الحل</button>
<div id="solutionDisplay"></div>

<h2>لوحة الإدارة لإضافة الحلول</h2>
<form id="adminForm">
<input id="problemKey" placeholder="ضع معرف المشكلة هنا" required>
<textarea id="solutionText" placeholder="اكتب الحل هنا" rows="3" required></textarea>
<button type="submit">تحديث الحل</button>
</form>

</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
import { getDatabase, ref, push, get, update } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyD0TgGcjrNx4p9BrUg6RfADRcR7_7U92OI",
  authDomain: "talkandsolve-4ca7d.firebaseapp.com",
  databaseURL: "https://talkandsolve-4ca7d-default-rtdb.firebaseio.com",
  projectId: "talkandsolve-4ca7d",
  storageBucket: "talkandsolve-4ca7d.appspot.com",
  messagingSenderId: "753365758409",
  appId: "1:753365758409:web:8a84f0f11467d1f001b818"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// --- Toast ---
function showToast(message){
  const t = document.getElementById("toast");
  t.textContent = message;
  t.style.opacity="1";
  setTimeout(()=>{ t.style.opacity="0"; },3000);
}

document.addEventListener("DOMContentLoaded", () => {
  const form = document.getElementById("problemForm");
  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const name = document.getElementById("name").value.trim();
    const type = document.getElementById("type").value.trim();
    const description = document.getElementById("description").value.trim();
    const agree = document.getElementById("agree").checked;
    if(!agree){ alert("يجب الموافقة على الشروط قبل الإرسال!"); return; }

    const shortId = Math.random().toString(36).substring(2,8).toUpperCase();

    push(ref(db, "problems/"+shortId), { name,type,description,solution:"",date:new Date().toISOString() })
      .then(()=>{ 
        document.getElementById("successSound").play();
        showToast("تم إرسال مشكلتك! معرفك: "+shortId);
        form.reset();
      })
      .catch(err=>alert("حدث خطأ: "+err));
  });

  const startBtn=document.getElementById("startBtn");
  const welcome=document.getElementById("welcomeScreen");
  const formScreen=document.getElementById("formScreen");
  startBtn.addEventListener("click",()=>{
    document.getElementById("clickSound").play();
    document.getElementById("backgroundMusic").play();
    welcome.classList.add("fadeOut");
    setTimeout(()=>{ welcome.style.display="none"; formScreen.style.display="flex"; formScreen.classList.add("fadeIn"); },700);
  });

  const toggleMode=document.getElementById("toggleModeBtn");
  toggleMode.addEventListener("click",()=>{
    document.body.classList.toggle("dark");
    document.body.classList.toggle("light");
  });

  const texts=["ارتاح واوجد حلول لمشاكلك العائلية.","شارك مشاكلك الاجتماعية بسهولة.","احصل على نصائح عملية لنفسيتك اليومية.","أنت لست وحدك، نحن هنا لنساعدك!"];
  let index=0;
  const dynamicText=document.getElementById("dynamicText");
  setInterval(()=>{
    index=(index+1)%texts.length;
    dynamicText.classList.add("fadeOutText");
    setTimeout(()=>{ dynamicText.textContent=texts[index]; dynamicText.classList.remove("fadeOutText"); },500);
  },4000);

  const checkBtn=document.getElementById("checkBtn");
  checkBtn.addEventListener("click",()=>{
    const key=document.getElementById("checkKey").value.trim();
    if(!key) return alert("يرجى إدخال معرف المشكلة");
    get(ref(db,"problems/"+key)).then(snapshot=>{
      if(snapshot.exists()){
        const solDiv=document.getElementById("solutionDisplay");
        solDiv.innerHTML='<div class="solutionCard">'+(snapshot.val().solution||"لم يتم الرد بعد، يرجى الانتظار")+'</div>';
        document.getElementById("solutionSound").play();
      }
      else{ alert("لم يتم العثور على مشكلتك"); }
    });
  });

  const adminForm=document.getElementById("adminForm");
  if(adminForm){
    adminForm.addEventListener("submit",(e)=>{
      e.preventDefault();
      const key=document.getElementById("problemKey").value.trim();
      const solutionText=document.getElementById("solutionText").value.trim();
      if(key && solutionText){
        update(ref(db,'problems/'+key),{solution:solutionText})
          .then(()=>showToast("تم إضافة الحل بنجاح!"))
          .catch(err=>alert("حدث خطأ: "+err));
      }
    });
  }

  const bubbleCount=20;
  for(let i=0;i<bubbleCount;i++){
    const bubble=document.createElement("div");
    bubble.classList.add("bubble");
    const size=Math.random()*60+20; bubble.style.width=size+"px"; bubble.style.height=size+"px";
    bubble.style.left=Math.random()*100+"%";
    bubble.style.animationDuration=(10+Math.random()*10)+"s";
    bubble.style.animationDelay=Math.random()*5+"s";
    document.body.appendChild(bubble);
  }
});
</script>
</body>
</html>
