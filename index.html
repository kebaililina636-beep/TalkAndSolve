<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>TalkAndSolve — حلول لمشاكلك اليومية</title>
<meta name="description" content="TalkAndSolve: شارك مشكلتك واحصل على حلول ونصائح عملية باللغة العربية." />

<!-- خطوط وأيقونات -->
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

<style>
/* كل الأنماط السابقة تبقى كما هي */
:root{
  --bg-start:#e9fbf6;
  --bg-end:#d9f6ef;
  --accent:#00a389;
  --accent-dark:#00796b;
  --muted:#4b6b66;
  --card:#ffffffdf;
  --radius:18px;
  --shadow: 0 20px 60px rgba(3,30,26,0.12);
  --soft-shadow: 0 10px 30px rgba(2,30,25,0.06);
  --success:#4caf50;
  --warning:#ff9800;
  --heart:#ff6b6b;
}

*{box-sizing:border-box}
html,body{height:100%;margin:0;font-family:'Cairo','Poppins',sans-serif;-webkit-font-smoothing:antialiased}
body{background:linear-gradient(180deg,var(--bg-start),var(--bg-end)); color:#053a35; overflow-x:hidden; transition: background 0.35s, color 0.35s;}

/* ... كل الأنماط السابقة تبقى كما هي ... */

</style>
</head>
<body class="light">

<!-- background decorations and bubbles -->
<div class="bg-decor" aria-hidden="true"></div>
<div class="bubbles" id="bubbles" aria-hidden="true"></div>
<div class="floating-hearts" id="floatingHearts"></div>

<!-- Hero -->
<section class="hero" aria-label="Welcome">
  <div class="hero-card" role="region" aria-label="Intro">
    <div class="hero-left">
      <h1 id="titleText">مرحبا في <span style="color:var(--accent)">TalkAndSolve</span>!</h1>
      <p id="subtitle">مكان هادئ وآمن لمشاركة مشاكلك والحصول على حلول بسيطة ومفيدة. اكتبي مشكلتك واحصلي على معرف لتتبع الحل.</p>

      <div class="cta-row" style="margin-top:12px">
        <button id="startBtn" class="btn btn-primary" aria-controls="formScreen">
          <i class="fas fa-play-circle"></i>
          ابدئي الآن
        </button>
        <button id="langBtn" class="btn btn-ghost small">
          <i class="fas fa-language"></i>
          EN
        </button>
        <button id="toggleModeBtn" class="btn btn-ghost small">
          <i class="fas fa-sun"></i>
          الوضع: نهاري
        </button>
        <button class="heart-btn" id="heartBtn" title="أعجبني">
          <i class="far fa-heart"></i>
        </button>
      </div>
      
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </div>

    <div class="hero-right">
      <div class="preview" aria-hidden="true">
        <div class="screen">
          <h3><i class="fas fa-magic"></i> كيف نعمل؟</h3>
          <p>أرسلي مشكلتك بإيجاز، ستحصلين على معرف للمتابعة، والإدارة ستضيف حلاً يظهر هنا لاحقًا.</p>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- MAIN -->
<main class="main" id="formScreen" style="display:none" aria-hidden="true">
  <!-- ... المحتوى السابق يبقى كما هو ... -->
</main>

<script>
// الكود الأساسي - بدون Firebase أولاً للتأكد من عمل الأزرار

// انتظار تحميل الصفحة بالكامل
document.addEventListener('DOMContentLoaded', function() {
    console.log('الصفحة محملة - جاهز لتشغيل الأزرار!');
    
    // الحصول على العناصر
    const startBtn = document.getElementById('startBtn');
    const langBtn = document.getElementById('langBtn');
    const toggleModeBtn = document.getElementById('toggleModeBtn');
    const heartBtn = document.getElementById('heartBtn');
    const formScreen = document.getElementById('formScreen');
    const heroSection = document.querySelector('.hero');

    // اختبار إذا العناصر موجودة
    if (!startBtn) console.error('زر البدء غير موجود!');
    if (!langBtn) console.error('زر اللغة غير موجود!');
    if (!toggleModeBtn) console.error('زر الوضع غير موجود!');
    
    console.log('جميع العناصر جاهزة:', {
        startBtn: !!startBtn,
        langBtn: !!langBtn,
        toggleModeBtn: !!toggleModeBtn,
        formScreen: !!formScreen
    });

    // 1. زر البدء
    startBtn.addEventListener('click', function() {
        console.log('زر البدء تم النقر عليه!');
        
        // إخفاء قسم البداية
        if (heroSection) {
            heroSection.style.display = 'none';
        }
        
        // إظهار نموذج الإرسال
        if (formScreen) {
            formScreen.style.display = 'block';
            formScreen.setAttribute('aria-hidden', 'false');
            formScreen.scrollIntoView({ behavior: 'smooth' });
        }
        
        // إظهار إشعار
        showNotification('مرحبا بك! اكتبي مشكلتك الآن 🌸', 'success');
    });

    // 2. زر اللغة
    let currentLang = 'ar';
    langBtn.addEventListener('click', function() {
        console.log('زر اللغة تم النقر عليه!');
        
        if (currentLang === 'ar') {
            // التغيير إلى الإنجليزية
            currentLang = 'en';
            langBtn.innerHTML = '<i class="fas fa-language"></i> AR';
            document.getElementById('titleText').innerHTML = 'Welcome to <span style="color:var(--accent)">TalkAndSolve</span>!';
            document.getElementById('subtitle').textContent = 'A quiet and safe place to share your problems and get simple, useful solutions. Write your problem and get an ID to track the solution.';
            document.querySelector('.preview h3').innerHTML = '<i class="fas fa-magic"></i> How it works?';
            document.querySelector('.preview p').textContent = 'Send your problem briefly, you will get an ID for follow-up, and the administration will add a solution that appears here later.';
            startBtn.innerHTML = '<i class="fas fa-play-circle"></i> Start Now';
            toggleModeBtn.innerHTML = '<i class="fas fa-sun"></i> Mode: Light';
        } else {
            // العودة إلى العربية
            currentLang = 'ar';
            langBtn.innerHTML = '<i class="fas fa-language"></i> EN';
            document.getElementById('titleText').innerHTML = 'مرحبا في <span style="color:var(--accent)">TalkAndSolve</span>!';
            document.getElementById('subtitle').textContent = 'مكان هادئ وآمن لمشاركة مشاكلك والحصول على حلول بسيطة ومفيدة. اكتبي مشكلتك واحصلي على معرف لتتبع الحل.';
            document.querySelector('.preview h3').innerHTML = '<i class="fas fa-magic"></i> كيف نعمل؟';
            document.querySelector('.preview p').textContent = 'أرسلي مشكلتك بإيجاز، ستحصلين على معرف للمتابعة، والإدارة ستضيف حلاً يظهر هنا لاحقًا.';
            startBtn.innerHTML = '<i class="fas fa-play-circle"></i> ابدئي الآن';
            toggleModeBtn.innerHTML = '<i class="fas fa-sun"></i> الوضع: نهاري';
        }
        
        showNotification(`تم التغيير إلى ${currentLang === 'ar' ? 'العربية' : 'English'} 🎯`, 'success');
    });

    // 3. زر الوضع الليلي/النهاري
    toggleModeBtn.addEventListener('click', function() {
        console.log('زر الوضع تم النقر عليه!');
        
        const body = document.body;
        const isDark = body.classList.contains('dark');
        
        if (isDark) {
            // التغيير إلى الوضع النهاري
            body.classList.remove('dark');
            body.classList.add('light');
            toggleModeBtn.innerHTML = '<i class="fas fa-sun"></i> الوضع: نهاري';
            if (currentLang === 'en') {
                toggleModeBtn.innerHTML = '<i class="fas fa-sun"></i> Mode: Light';
            }
        } else {
            // التغيير إلى الوضع الليلي
            body.classList.remove('light');
            body.classList.add('dark');
            toggleModeBtn.innerHTML = '<i class="fas fa-moon"></i> الوضع: ليلي';
            if (currentLang === 'en') {
                toggleModeBtn.innerHTML = '<i class="fas fa-moon"></i> Mode: Dark';
            }
        }
        
        showNotification(`تم التغيير إلى الوضع ${isDark ? 'النهاري' : 'الليلي'} 🌙`, 'success');
    });

    // 4. زر الإعجاب
    heartBtn.addEventListener('click', function() {
        console.log('زر القلب تم النقر عليه!');
        
        const icon = this.querySelector('i');
        this.classList.toggle('liked');
        
        if (this.classList.contains('liked')) {
            icon.className = 'fas fa-heart';
            showNotification('شكراً لحسن ظنك! 🤍', 'success');
        } else {
            icon.className = 'far fa-heart';
            showNotification('تم إزالة الإعجاب 💔', 'warning');
        }
    });

    // دالة الإشعارات
    function showNotification(message, type = 'success') {
        // إنشاء عنصر إشعار جديد
        const notification = document.createElement('div');
        notification.className = `notification ${type} show`;
        notification.innerHTML = `
            <i class="fas fa-${type === 'success' ? 'check' : 'exclamation'}-circle"></i>
            <span>${message}</span>
        `;
        
        // إضافة الأنماط إذا لم تكن موجودة
        if (!document.querySelector('.notification')) {
            const style = document.createElement('style');
            style.textContent = `
                .notification {
                    position: fixed;
                    top: 20px;
                    right: 20px;
                    padding: 12px 16px;
                    border-radius: 10px;
                    background: white;
                    box-shadow: 0 20px 60px rgba(3,30,26,0.12);
                    transform: translateX(150%);
                    transition: transform 0.3s;
                    z-index: 10000;
                    display: flex;
                    align-items: center;
                    gap: 8px;
                    border-left: 4px solid var(--success);
                }
                .notification.show {
                    transform: translateX(0);
                }
                .notification.success {
                    border-left-color: var(--success);
                }
                .notification.warning {
                    border-left-color: var(--warning);
                }
                body.dark .notification {
                    background: #1a1a1a;
                    color: white;
                }
            `;
            document.head.appendChild(style);
        }
        
        document.body.appendChild(notification);
        
        // إزالة الإشعار بعد 3 ثوان
        setTimeout(() => {
            notification.classList.remove('show');
            setTimeout(() => {
                if (notification.parentNode) {
                    notification.parentNode.removeChild(notification);
                }
            }, 300);
        }, 3000);
    }

    // إنشاء الفقاعات
    function createBubbles(n = 16) {
        const bubblesEl = document.getElementById('bubbles');
        if (!bubblesEl) return;
        
        for (let i = 0; i < n; i++) {
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            const size = Math.random() * 70 + 20;
            bubble.style.width = size + 'px';
            bubble.style.height = size + 'px';
            bubble.style.left = Math.random() * 100 + '%';
            bubble.style.animationDuration = (12 + Math.random() * 12) + 's';
            bubble.style.animationDelay = Math.random() * 6 + 's';
            bubble.style.opacity = 0.25 + Math.random() * 0.5;
            bubblesEl.appendChild(bubble);
        }
    }

    // إنشاء القلوب
    function createFloatingHearts() {
        const heartsContainer = document.getElementById('floatingHearts');
        if (!heartsContainer) return;
        
        for (let i = 0; i < 12; i++) {
            const heart = document.createElement('div');
            heart.className = 'heart';
            heart.innerHTML = '💖';
            heart.style.left = Math.random() * 100 + '%';
            heart.style.animationDelay = Math.random() * 8 + 's';
            heart.style.fontSize = (Math.random() * 20 + 16) + 'px';
            heartsContainer.appendChild(heart);
        }
    }

    // تشغيل الرسوم المتحركة
    createBubbles(20);
    createFloatingHearts();

    console.log('جميع الأزرار جاهزة للعمل! 🎉');
});

// إضافة شريط التقدم
window.addEventListener('scroll', function() {
    const progressFill = document.getElementById('progressFill');
    if (progressFill) {
        const scrollable = document.documentElement.scrollHeight - window.innerHeight;
        const scrolled = (window.scrollY / scrollable) * 100;
        progressFill.style.width = scrolled + '%';
    }
});
</script>
</body>
</html>
