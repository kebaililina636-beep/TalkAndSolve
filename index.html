<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TalkAndSolve</title>
<style>
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background-color: #e6f2e6;
    color: #064420;
    margin: 0;
    padding: 0;
  }
  .container {
    max-width: 700px;
    margin: 30px auto;
    background: #cce5cc;
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
  }
  h1 { text-align: center; margin-bottom: 25px; }
  form { display: flex; flex-direction: column; }
  input, textarea {
    width: 100%;
    margin: 10px 0;
    padding: 12px;
    border-radius: 8px;
    border: 1px solid #99cc99;
    background-color: #f0fff0;
    font-size: 16px;
    box-sizing: border-box;
  }
  textarea { resize: vertical; min-height: 80px; }
  button {
    padding: 12px;
    margin-top: 15px;
    border: none;
    border-radius: 8px;
    background: #3d9970;
    color: #fff;
    font-size: 16px;
    cursor: pointer;
    transition: background 0.3s;
  }
  button:hover { background: #2e7554; }
  label { display: flex; align-items: center; margin-top: 10px; font-size: 14px; gap: 5px; }
  label input { margin: 0; }
  .problems { margin-top: 40px; }
  .problem {
    background: #f0fff0;
    border: 1px solid #99cc99;
    padding: 15px;
    border-radius: 10px;
    margin-bottom: 15px;
  }
  .problem h3 { margin: 0 0 8px 0; }
  .solution {
    margin-top: 10px;
    padding: 10px;
    background: #d9f2d9;
    border-radius: 8px;
    font-style: italic;
  }
  .solution-input {
    margin-top: 10px;
    display: flex;
    gap: 5px;
  }
  .solution-input input {
    flex: 1;
    padding: 10px;
    border-radius: 6px;
    border: 1px solid #99cc99;
    font-size: 14px;
  }
  .solution-input button {
    padding: 10px 15px;
    font-size: 14px;
  }
  @media (max-width: 750px) {
    .container { margin: 20px; padding: 20px; }
  }
</style>
</head>
<body>

<div class="container">
  <h1>TalkAndSolve</h1>

  <form id="problemForm">
    <input type="text" id="name" placeholder="اسمك (اختياري)">
    <input type="email" id="email" placeholder="البريد الإلكتروني (اختياري)">
    <input type="text" id="type" placeholder="نوع المشكلة" required>
    <textarea id="description" placeholder="صف المشكلة" required></textarea>
    <label>
      <input type="checkbox" id="agree" required> أوافق على الشروط
    </label>
    <button type="submit">إرسال</button>
  </form>

  <div class="problems" id="problemsList">
    <h2>المشاكل المرسلة:</h2>
  </div>
</div>

<!-- Firebase libraries -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-analytics-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyD0TgGcjrNx4p9BrUg6RfADRcR7_7U92OI",
  authDomain: "talkandsolve-4ca7d.firebaseapp.com",
  databaseURL: "https://talkandsolve-4ca7d-default-rtdb.firebaseio.com",
  projectId: "talkandsolve-4ca7d",
  storageBucket: "talkandsolve-4ca7d.firebasestorage.app",
  messagingSenderId: "753365758409",
  appId: "1:753365758409:web:8a84f0f11467d1f001b818",
  measurementId: "G-Y0SDMHNYEZ"
};

firebase.initializeApp(firebaseConfig);
const database = firebase.database();
const analytics = firebase.analytics();

const form = document.getElementById("problemForm");
const problemsList = document.getElementById("problemsList");

// إرسال المشكلة
form.addEventListener("submit", function(e){
  e.preventDefault();
  const agree = document.getElementById("agree");
  if(!agree.checked){
    alert("يجب الموافقة على الشروط لإرسال المشكلة");
    return;
  }

  const name = document.getElementById("name").value || "مجهول";
  const email = document.getElementById("email").value || "";
  const type = document.getElementById("type").value;
  const description = document.getElementById("description").value;

  const newRef = database.ref("problems").push();
  newRef.set({
    name, email, type, description, solution: "", createdAt: Date.now()
  }).then(()=>{
    alert("تم الإرسال!");
    form.reset();
  }).catch(err=>{
    console.error(err);
    alert("حدث خطأ أثناء الإرسال.");
  });
});

// عرض المشاكل مباشرة وتحديث الحلول فورًا
const problemsRef = database.ref("problems");
problemsRef.on("value", snapshot => {
  problemsList.innerHTML = "<h2>المشاكل المرسلة:</h2>";
  snapshot.forEach(child => {
    const data = child.val();
    const problemDiv = document.createElement("div");
    problemDiv.className = "problem";
    problemDiv.innerHTML = `
      <h3>${data.name} - ${data.type}</h3>
      <p>${data.description}</p>
      <div class="solution">${data.solution && data.solution.trim() !== "" ? "الحل: " + data.solution : "لم يتم حلها بعد"}</div>
      <div class="solution-input">
        <input type="text" placeholder="اكتب حلك هنا..." id="solutionInput-${child.key}">
        <button onclick="addSolution('${child.key}')">حفظ الحل</button>
      </div>
    `;
    problemsList.appendChild(problemDiv);
  });
});

// حفظ الحل
function addSolution(key){
  const input = document.getElementById(`solutionInput-${key}`);
  const value = input.value.trim();
  if(value === "") return;
  database.ref(`problems/${key}/solution`).set(value);
  input.value = "";
}
</script>

</body>
</html>
