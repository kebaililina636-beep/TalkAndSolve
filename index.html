<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TalkAndSolve — حلول لمشاكلك اليومية</title>
<meta name="description" content="TalkAndSolve: شارك مشكلتك واحصل على حلول ونصائح عملية باللغة العربية.">

<!-- Firebase SDK -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyD0TgGcjrNx4p9BrUg6RfADRcR7_7U92OI",
  authDomain: "talkandsolve-4ca7d.firebaseapp.com",
  databaseURL: "https://talkandsolve-4ca7d-default-rtdb.firebaseio.com",
  projectId: "talkandsolve-4ca7d",
  storageBucket: "talkandsolve-4ca7d.appspot.com",
  messagingSenderId: "753365758409",
  appId: "1:753365758409:web:8a84f0f11467d1f001b818"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

document.addEventListener("DOMContentLoaded", () => {
  // نموذج المشاكل
  const form = document.getElementById("problemForm");
  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const name = document.getElementById("name").value.trim();
    const type = document.getElementById("type").value.trim();
    const description = document.getElementById("description").value.trim();
    const agree = document.getElementById("agree").checked;

    if (!agree) {
      alert("يجب الموافقة على الشروط قبل الإرسال!");
      return;
    }

    push(ref(db, "problems"), {
      name, type, description, date: new Date().toISOString()
    })
    .then(() => {
      document.getElementById("successSound").play();
      alert("تم إرسال مشكلتك بنجاح!");
      form.reset();
    })
    .catch((err) => {
      alert("حدث خطأ أثناء الإرسال: " + err);
    });
  });

  // زر البدء وتحويل الشاشة
  const startBtn = document.getElementById("startBtn");
  const welcome = document.getElementById("welcomeScreen");
  const formScreen = document.getElementById("formScreen");

  startBtn.addEventListener("click", () => {
    document.getElementById("clickSound").play();
    welcome.classList.add("fadeOut");
    setTimeout(() => {
      welcome.style.display = "none";
      formScreen.style.display = "flex";
      formScreen.classList.add("fadeIn");
    }, 700);
  });

  // نصوص ترحيب متغيرة
  const texts = [
    "ارتاح واوجد حلول لمشاكلك العائلية.",
    "شارك مشاكلك الاجتماعية بسهولة.",
    "احصل على نصائح عملية لنفسيتك اليومية.",
    "أنت لست وحدك، نحن هنا لنساعدك!"
  ];
  let index = 0;
  const dynamicText = document.getElementById("dynamicText");
  setInterval(() => {
    index = (index + 1) % texts.length;
    dynamicText.classList.add("fadeOutText");
    setTimeout(() => {
      dynamicText.textContent = texts[index];
      dynamicText.classList.remove("fadeOutText");
    }, 500);
  }, 4000);
});
</script>

<style>
body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  margin: 0;
  background: linear-gradient(135deg, #d0f0ea, #a8e0d0);
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}

/* الحاوية */
.container {
  background: linear-gradient(to bottom, #ffffff, #e0f2f1);
  border-radius: 30px;
  padding: 40px 35px;
  max-width: 550px;
  width: 90%;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  box-shadow: 0 15px 50px rgba(0,0,0,0.2);
}

/* الترحيب */
h1 {
  margin-bottom: 15px;
  font-size: 30px;
  color: #004d40;
}

#dynamicText {
  font-size: 18px;
  margin-bottom: 30px;
  color: #00695c;
  transition: opacity 0.5s ease;
}

.fadeOutText { opacity: 0; }

/* النموذج */
form {
  display: grid;
  grid-gap: 15px;
  width: 100%;
}

input, textarea {
  padding: 15px;
  border-radius: 12px;
  border: 1px solid #a8e0d0;
  font-size: 16px;
  background-color: #f0fdf9;
  width: 100%;
  resize: vertical;
}

label {
  display: flex;
  align-items: center;
  font-size: 14px;
  gap: 10px;
}

button {
  padding: 14px 0;
  border-radius: 12px;
  border: none;
  background: linear-gradient(to right, #009688, #00695c);
  color: #fff;
  font-size: 18px;
  cursor: pointer;
  transition: all 0.3s ease;
}

button:hover {
  transform: scale(1.05);
  box-shadow: 0 8px 25px rgba(0,0,0,0.25);
}

/* شاشة البداية والنموذج */
#welcomeScreen { display: flex; flex-direction: column; align-items: center; justify-content: center; }
#formScreen { display: none; flex-direction: column; align-items: center; justify-content: center; opacity: 0; }

/* تأثيرات الحركة */
.fadeOut { animation: fadeOut 0.7s forwards; }
.fadeIn { animation: fadeIn 0.7s forwards; }

@keyframes fadeOut { to { opacity: 0; transform: translateY(-20px); } }
@keyframes fadeIn { to { opacity: 1; transform: translateY(0); } }

/* Responsive */
@media (max-width: 600px) {
  .container { padding: 30px 20px; }
  h1 { font-size: 24px; }
  #dynamicText { font-size: 16px; }
  button { font-size: 16px; }
}
</style>
</head>
<body>
<!-- الأصوات -->
<audio id="clickSound" src="https://www.soundjay.com/buttons/sounds/button-16.mp3"></audio>
<audio id="successSound" src="https://www.soundjay.com/buttons/sounds/button-3.mp3"></audio>

<!-- شاشة الترحيب -->
<div id="welcomeScreen" class="container">
<h1>مرحبا بك في TalkAndSolve!</h1>
<p id="dynamicText">ارتاح واوجد حلول لمشاكلك العائلية.</p>
<button id="startBtn">ابدأ الآن</button>
</div>

<!-- شاشة نموذج المشاكل -->
<div id="formScreen" class="container">
<h1>أرسل مشكلتك</h1>
<form id="problemForm">
<input type="text" id="name" placeholder="اسمك" required>
<input type="text" id="type" placeholder="نوع المشكلة" required>
<textarea id="description" placeholder="صف المشكلة" rows="5" required></textarea>
<label>
<input type="checkbox" id="agree" required> أوافق على الشروط
</label>
<button type="submit">إرسال</button>
</form>
</div>
</body>
</html>
